<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mandarin Practice</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="player" aria-label="Phone practice session">
        <header class="topbar">
          <div>
            <p class="section-label">Session</p>
            <h1>Mandarin Practice</h1>
          </div>
          <span class="status" id="sessionStatus">No session</span>
        </header>

        <section class="stage" aria-label="Current card">
          <div class="progress-row">
            <span id="progressText">0 / 0</span>
            <progress id="progressBar" max="1" value="0"></progress>
          </div>

          <div class="prompt-card">
            <p class="prompt-kicker" id="phaseLabel">Ready</p>
            <p class="prompt" id="promptText">No session loaded.</p>
            <div class="answer" id="answerBlock" hidden>
              <span lang="zh-Hans" id="answerText"></span>
              <small id="pinyinText"></small>
              <small id="notesText"></small>
            </div>
          </div>

          <div class="timer" aria-label="Response gap">
            <span id="timerFill"></span>
          </div>

          <div class="pronunciation" id="pronunciationPanel" aria-live="polite">
            <span id="pronunciationStatus">Pronunciation feedback unavailable.</span>
            <strong id="pronunciationFeedback">Manual rating is still available.</strong>
            <small id="pronunciationTranscript"></small>
          </div>

          <div class="transport">
            <button class="primary" id="startSession" type="button">Start</button>
            <button class="secondary" id="playPrompt" type="button">Prompt</button>
            <button class="secondary" id="playAnswer" type="button">Answer</button>
          </div>

          <div class="rating-row" aria-label="Rating">
            <button type="button" data-rating="n">Again</button>
            <button type="button" data-rating="h">Hard</button>
            <button type="button" data-rating="y">Good</button>
          </div>
        </section>

        <aside class="setup" aria-label="Session setup">
          <div class="panel-header">
            <div>
              <p class="section-label">Manifest</p>
              <h2 id="sessionTitle">latest/session.json</h2>
            </div>
            <button class="secondary compact" id="downloadRatings" type="button">Export</button>
          </div>

          <div class="control-grid">
            <label>
              <span>Gap seconds</span>
              <input id="gapSeconds" type="number" min="0" max="30" value="5">
            </label>
            <label>
              <span>Answer speed</span>
              <select id="speedPreset">
                <option value="normal">Normal</option>
                <option value="slow">Slow</option>
              </select>
            </label>
            <label class="switch">
              <input id="repeatAnswer" type="checkbox">
              <span></span>
              Repeat answer
            </label>
          </div>

          <div class="command-box">
            <code id="commandText">uv run --extra edge mandarin session build --latest --limit 10</code>
          </div>

          <label class="file-picker">
            <input id="sessionFile" type="file" accept="application/json,.json">
            <span>Load session.json</span>
          </label>
        </aside>

        <audio id="promptAudio" preload="metadata"></audio>
        <audio id="answerAudio" preload="metadata"></audio>
      </section>
    </main>
    <script src="./pronunciation.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
