[project]
name = "mandarin-api"
version = "0.1.0"
description = "Server-owned backend for Mandarin Practice: content, accounts, progress, transcription"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy; installed on the box, lazy-imported at runtime. Kept out of the default
# set so local dev/tests don't pull CTranslate2 + model weights.
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
