name: Update site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-site.yml"
      - "README.md"
      - "docs/**"
      - "src/**"
      - "website/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  dispatch-site-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ethanadams.dev deploy
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "SITE_REPO_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ethan-adams/ethanadams.dev/dispatches \
            --data "{\"event_type\":\"mandarin-updated\",\"client_payload\":{\"source_repo\":\"ethan-adams/mandarin-lesson-practice\",\"source_ref\":\"${SOURCE_REF}\",\"source_sha\":\"${SOURCE_SHA}\"}}"
